<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Onet Reader</title>
<style>
  :root {
    --bg: #f5f6f8;
    --panel: #ffffff;
    --border: #dde3ea;
    --text: #1a1a1a;
    --muted: #6b7684;
    --accent: #0055ff;
    --font-ui: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
    --font-read: Georgia, "Times New Roman", serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: var(--font-ui);
    background: var(--bg);
    color: var(--text);
  }
  header {
    position: sticky; top: 0; z-index: 10;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    padding: 12px 16px;
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  }
  h1 { font-size: 20px; margin: 0; white-space: nowrap; color: var(--text); }
  h1 .dot { color: var(--accent); }
  .controls { display: flex; gap: 10px; align-items: center; flex: 1; flex-wrap: wrap; }
  input[type=text], select {
    background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 12px; font-size: 14px; outline: none; font-family: var(--font-ui);
  }
  input[type=text]:focus, select:focus { border-color: var(--accent); background: var(--panel); }
  input[type=text] { flex: 1; min-width: 180px; }
  button {
    background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 14px; cursor: pointer; font-size: 14px;
    transition: background .15s; font-family: var(--font-ui);
  }
  button:hover { background: var(--border); }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; overflow-x: auto; padding: 10px 16px 0; }
  .tab {
    padding: 7px 14px; background: var(--panel); color: var(--muted);
    border: 1px solid var(--border); border-bottom: none; border-radius: 10px 10px 0 0;
    cursor: pointer; font-size: 14px; white-space: nowrap; font-family: var(--font-ui);
  }
  .tab.active { background: var(--panel); color: var(--accent); font-weight: 600; border-top: 2px solid var(--accent); }
  .tab .count { opacity: .6; font-size: 12px; margin-left: 4px; }
  main { padding: 16px; }
  #list { display: flex; flex-direction: column; gap: 10px; }
  .item {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    border-left: 6px solid var(--cat-color, var(--border));
    padding: 14px 16px; cursor: pointer; transition: border-color .15s, transform .1s;
  }
  .item:hover { border-color: var(--text); transform: translateY(-1px); }
  .item.read .title { color: var(--muted); text-decoration: line-through; }
  .item .title { font-size: 16px; line-height: 1.4; }
  .item .meta { margin-top: 8px; display: flex; gap: 12px; font-size: 12px; color: var(--muted); }
  .badge {
    background: var(--cat-color, var(--panel2));
    border-radius: 6px; padding: 2px 8px;
    font-size: 12px; color: #fff;
  }
  .badge.read { background: var(--muted); }
  .badge.cat { background: transparent; padding: 2px 0; font-weight: 600; color: var(--cat-color, var(--text)); }
  #empty { color: var(--muted); text-align: center; padding: 40px 0; }
  #loader { text-align: center; padding: 30px; color: var(--muted); }
  #spinner {
    width: 28px; height: 28px; margin: 0 auto 10px;
    border: 3px solid var(--border); border-top-color: var(--accent);
    border-radius: 50%; animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  /* czytnik */
  #reader-overlay {
    position: fixed; inset: 0; background: rgba(30,30,30,.5);
    display: none; align-items: center; justify-content: center; z-index: 50; padding: 20px;
  }
  #reader-overlay.open { display: flex; }
  #reader {
    background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
    max-width: 820px; width: 100%; max-height: 90vh; overflow-y: auto;
  }
  #reader .topbar {
    position: sticky; top: 0; background: var(--panel); padding: 12px 18px;
    border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center;
  }
  #reader .topbar a { color: var(--accent); font-size: 13px; }
  #reader .close { background: none; border: none; color: var(--muted); font-size: 24px; cursor: pointer; }
  #reader .body { padding: 24px 30px 32px; }
  #reader .title { font-family: var(--font-read); font-size: 28px; line-height: 1.3; margin: 0 0 12px; color: var(--text); }
  #reader .lead { color: var(--muted); font-size: 17px; line-height: 1.5; font-family: var(--font-read); margin-bottom: 18px; }
  #reader img.hero { width: 100%; border-radius: 10px; margin-bottom: 20px; }
  #reader .content {
    font-family: var(--font-read);
    font-size: 18px; line-height: 1.75; color: var(--text);
    white-space: pre-wrap;
  }
  #reader .spinner-box { padding: 40px; text-align: center; color: var(--muted); }
  .muted { color: var(--muted); font-size: 13px; }
  .cat-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
</style>
</head>
<body>

<header>
  <h1>Onet<span class="dot">.</span>Reader</h1>
  <div class="controls">
    <input id="search" type="text" placeholder="Szukaj w tytułach..." autocomplete="off">
    <select id="sort">
      <option value="newest">Najnowsze</option>
      <option value="oldest">Najstarsze</option>
      <option value="title">Tytuł A-Z</option>
      <option value="read">Przeczytane pierwsze</option>
    </select>
    <label class="muted" style="display:flex;gap:6px;align-items:center;">
      <input type="checkbox" id="unread"> tylko nieprzeczytane
    </label>
    <button id="refresh" class="primary">Odśwież</button>
  </div>
</header>

<nav class="tabs" id="tabs"></nav>

<main>
  <div id="list"></div>
  <div id="empty" style="display:none;">Brak artykułów.</div>
</main>

<div id="reader-overlay">
  <div id="reader">
    <div class="topbar">
      <a id="read-orig" href="#" target="_blank" rel="noopener">Oryginał ↗</a>
      <button class="close" id="close-reader">✕</button>
    </div>
    <div class="body" id="reader-body"></div>
  </div>
</div>

<script>
const CAT_COLORS = {
  "najnowsze": "#d32f2f",
  "wiadomosci": "#1565c0",
  "sport": "#2e7d32",
  "biznes": "#e65100",
  "kultura": "#7b1fa2",
  "technologie": "#00695c",
  "inspiracje": "#f9a825",
  "motoryzacja": "#37474f",
  "podroze": "#00838f",
};
const catColor = (c) => CAT_COLORS[c] || "#6b7684";

let state = { category: "wszystkie", articles: [], counts: {} };

const CATS = [
  ["wszystkie", "Wszystkie"],
  ["najnowsze", "Najnowsze"],
  ["wiadomosci", "Wiadomości"],
  ["sport", "Sport"],
  ["biznes", "Biznes"],
  ["kultura", "Kultura"],
  ["technologie", "Technologie"],
  ["inspiracje", "Inspiracje"],
  ["motoryzacja", "Motoryzacja"],
  ["podroze", "Podróże"],
];

const $ = (id) => document.getElementById(id);

function fmt(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  return d.toLocaleString("pl-PL", {
    day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit"
  });
}

function renderTabs() {
  const t = $("tabs");
  t.innerHTML = "";
  for (const [key, label] of CATS) {
    const d = document.createElement("div");
    d.className = "tab" + (key === state.category ? " active" : "");
    d.style.color = key === state.category ? catColor(key) : "";
    d.textContent = label;
    if (state.counts[key]) {
      const c = document.createElement("span");
      c.className = "count";
      c.textContent = state.counts[key];
      d.appendChild(c);
    }
    d.onclick = () => { state.category = key; loadArticles(); };
    t.appendChild(d);
  }
}

function renderList() {
  const list = $("list");
  const empty = $("empty");
  if (!state.articles.length) {
    list.innerHTML = "";
    empty.style.display = "block";
    return;
  }
  empty.style.display = "none";
  list.innerHTML = "";
  for (const a of state.articles) {
    const el = document.createElement("div");
    const color = catColor(a.category);
    el.className = "item" + (a.is_read ? " read" : "");
    el.style.setProperty("--cat-color", color);
    el.innerHTML = `
      <div class="title"></div>
      <div class="meta">
        <span class="badge cat"><span class="cat-dot" style="background:${color}"></span></span>
        <span class="badge ${a.is_read ? "read" : ""}">${a.is_read ? "przeczytano" : "nowy"}</span>
        <span>${fmt(a.last_seen)}</span>
      </div>`;
    const catB = el.querySelector(".badge.cat");
    catB.appendChild(document.createTextNode(a.category));
    el.querySelector(".title").textContent = a.title;
    el.onclick = () => openReader(a);
    list.appendChild(el);
  }
}

async function loadArticles() {
  const list = $("list");
  list.innerHTML = '<div id="loader"><div id="spinner"></div>Ładowanie...</div>';
  $("empty").style.display = "none";

  const url = new URL("/api/articles", location.origin);
  url.searchParams.set("category", state.category);
  url.searchParams.set("q", $("search").value.trim());
  url.searchParams.set("sort", $("sort").value);
  url.searchParams.set("unread", $("unread").checked);

  try {
    const r = await fetch(url);
    const data = await r.json();
    state.articles = data;
  } catch (e) {
    state.articles = [];
  }
  renderList();
}

async function loadCounts() {
  try {
    const r = await fetch("/api/articles");
    const all = await r.json();
    const counts = { "wszystkie": all.length };
    for (const a of all) counts[a.category] = (counts[a.category] || 0) + 1;
    state.counts = counts;
  } catch (e) {
    state.counts = {};
  }
  renderTabs();
}

async function refresh() {
  const btn = $("refresh");
  if (btn.dataset.busy) return;
  btn.dataset.busy = "1";
  btn.disabled = true;
  btn.textContent = "Pobieranie...";
  try {
    const r = await fetch("/api/refresh", { method: "POST" });
    const res = await r.json();
    if (res.status === "waiting" || res.status === "quota") {
      await waitForRefresh(res);
      return;
    }
    if (res.status === "refreshing") {
      await waitForRefresh({ status: "waiting", wait_seconds: 0, reason: "Odświeżanie w toku" });
      return;
    }
    await loadCounts();
    await loadArticles();
    console.log("Odświeżono:", res);
  } catch (e) {
    alert("Błąd odświeżania: " + e.message);
  } finally {
    btn.dataset.busy = "";
    btn.disabled = false;
    btn.textContent = "Odśwież";
  }
}

function fmtWait(sec) {
  const s = Math.max(0, Math.ceil(sec));
  const m = Math.floor(s / 60);
  const r = s % 60;
  return m > 0 ? `${m}m ${r}s` : `${r}s`;
}

async function waitForRefresh(res) {
  const btn = $("refresh");
  const reason = res.status === "quota"
    ? "Limit odświeżeń na godzinę osiągnięty"
    : (res.reason || "Czekam na odświeżenie (min. 140 s)");
  btn.textContent = `${reason}...`;
  const until = Date.now() + (res.wait_seconds || 0) * 1000;
  while (Date.now() < until) {
    const left = (until - Date.now()) / 1000;
    btn.textContent = `${reason} (${fmtWait(left)})`;
    await new Promise((r) => setTimeout(r, 500));
  }
  // odświeżenie jest teraz dozwolone — spróbuj ponownie
  btn.dataset.busy = "";
  await refresh();
}

async function openReader(a) {
  const overlay = $("reader-overlay");
  const body = $("reader-body");
  $("read-orig").href = a.link;
  body.innerHTML = '<div class="spinner-box"><div id="spinner"></div>Pobieranie treści...</div>';
  overlay.classList.add("open");

  try {
    const r = await fetch(`/api/articles/${encodeURIComponent(a.link)}/read`);
    if (!r.ok && r.status !== 404) throw new Error(r.status);
    const data = await r.json();
    const d = data.details || {};

    let html = `<h2 class="title"></h2>`;
    if (d.image) html += `<img class="hero" src="${d.image}" alt="" onerror="this.style.display='none'">`;
    if (d.lead) {
      const leadMode = document.createElement("div");
      leadMode.className = "lead";
      leadMode.textContent = d.lead;
      html += leadMode.outerHTML;
    }
    const contentMode = document.createElement("div");
    contentMode.className = "content";
    contentMode.textContent = d.content || data.content || "(brak treści)";
    html += contentMode.outerHTML;

    body.innerHTML = html;
    body.querySelector(".title").textContent = data.title || a.title;
    await loadList();
  } catch (e) {
    body.innerHTML = `<p class="muted">Nie udało się pobrać treści: ${e.message}</p>`;
  }
}

$("close-reader").onclick = () => $("reader-overlay").classList.remove("open");
$("reader-overlay").onclick = (e) => { if (e.target.id === "reader-overlay") $("reader-overlay").classList.remove("open"); };

let debounce;
$("search").addEventListener("input", () => { clearTimeout(debounce); debounce = setTimeout(loadArticles, 250); });
$("sort").addEventListener("change", loadArticles);
$("unread").addEventListener("change", loadArticles);
$("refresh").addEventListener("click", refresh);

async function loadList() {
  const url = new URL("/api/articles", location.origin);
  url.searchParams.set("category", state.category);
  url.searchParams.set("q", $("search").value.trim());
  url.searchParams.set("sort", $("sort").value);
  url.searchParams.set("unread", $("unread").checked);
  const r = await fetch(url);
  state.articles = await r.json();
  renderList();
}

(async function init() {
  await loadCounts();
  await loadArticles();
  refresh();
})();
</script>
</body>
</html>
